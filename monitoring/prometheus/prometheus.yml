# Prometheus Configuration for ClearWay Monitoring Stack
# Scrapes metrics from FastAPI, Celery (Flower), and PostgreSQL

global:
  scrape_interval: 15s  # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate recording/alerting rules every 15 seconds
  scrape_timeout: 10s  # Timeout after 10 seconds

# Scrape configuration
scrape_configs:
  # ============================================================================
  # FastAPI Application Metrics
  # ============================================================================
  - job_name: 'mobile-fastapi'
    static_configs:
      - targets: ['mobile_backend:8000']  # Docker container name + port
    metrics_path: '/metrics'  # Endpoint exposed by prometheus-fastapi-instrumentator
    scrape_interval: 10s  # Scrape more frequently for API metrics
    
  # ============================================================================
  # Celery Metrics via Flower
  # ============================================================================
  - job_name: 'mobile-celery'
    static_configs:
      - targets: ['mobile_flower:5555']  # Docker container name + port
    metrics_path: '/metrics'  # Flower exposes Prometheus metrics on /metrics
    scrape_interval: 15s

  # ============================================================================
  # Celery Worker Custom Metrics
  # ============================================================================
  - job_name: 'mobile-worker'
    static_configs:
      - targets: ['mobile_celery_worker:8001']  # Celery worker process metrics endpoint
    metrics_path: '/metrics'
    scrape_interval: 15s
    
  # ============================================================================
  # PostgreSQL Database Metrics
  # ============================================================================
  - job_name: 'mobile-postgres'
    static_configs:
      - targets: ['mobile_postgres_exporter:9187']  # Docker container name + port
    metrics_path: '/metrics'
    scrape_interval: 30s  # DB metrics change less frequently

  # ============================================================================
  # Container Infrastructure Metrics via cAdvisor
  # ============================================================================
  - job_name: 'mobile-cadvisor'
    static_configs:
      - targets: ['mobile_cadvisor:8080']  # Docker container name + cAdvisor port
    metrics_path: '/metrics'
    scrape_interval: 15s
    
  # ============================================================================
  # Prometheus Self-Monitoring
  # ============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
