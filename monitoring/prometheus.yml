# Prometheus Configuration for ClearWay Monitoring Stack
# Scrapes metrics from FastAPI, Celery (Flower), and PostgreSQL

global:
  scrape_interval: 15s  # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate recording/alerting rules every 15 seconds
  scrape_timeout: 10s  # Timeout after 10 seconds

# Scrape configuration
scrape_configs:
  # ============================================================================
  # FastAPI Application Metrics
  # ============================================================================
  - job_name: 'clearway-fastapi'
    static_configs:
      - targets: ['api:8000']  # Docker service name + port
    metrics_path: '/metrics'  # Endpoint exposed by prometheus-fastapi-instrumentator
    scrape_interval: 10s  # Scrape more frequently for API metrics
    
  # ============================================================================
  # Celery Metrics via Flower
  # ============================================================================
  - job_name: 'clearway-celery'
    static_configs:
      - targets: ['flower:5555']  # Docker service name + port
    metrics_path: '/metrics'  # Flower exposes Prometheus metrics on /metrics
    scrape_interval: 15s
    
  # ============================================================================
  # PostgreSQL Database Metrics
  # ============================================================================
  - job_name: 'clearway-postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']  # Docker service name + port
    metrics_path: '/metrics'
    scrape_interval: 30s  # DB metrics change less frequently
    
  # ============================================================================
  # Prometheus Self-Monitoring
  # ============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
