name: Mobile App CI (Jest Tests)

on:
  push:
    branches:
      - dev
    paths:
      - 'mobileApp/**'
      - '.github/workflows/test_mobileApp.yml'

  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'mobileApp/**'
      - '.github/workflows/test_mobileApp.yml'

  # Allows this workflow to be called from build_mobileApp.yml via needs/uses.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobileApp/ClearWayApp

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run Jest tests
      run: npm test