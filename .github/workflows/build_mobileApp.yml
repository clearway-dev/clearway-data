name: Build Mobile App (APK)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mobileApp/ClearWayApp/**'
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test_mobileApp.yml

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./mobileApp/ClearWayApp
        run: npm install

      - name: Build APK via EAS
        working-directory: ./mobileApp/ClearWayApp
        # --non-interactive suppresses confirmation prompts in CI environments.
        run: eas build --platform android --profile preview --non-interactive